<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsfeed Lite</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f6fed'/><path d='M8 9h16M8 15h16M8 21h10' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>">
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eef0f3; --text: #16181d; --muted: #5d6573;
    --border: #dfe2e8; --accent: #2f6fed; --accent-text: #ffffff; --danger: #c93a3a; --ok: #1f8a4c;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 12px rgba(16,24,40,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --surface: #171a21; --surface-2: #1f232c; --text: #e7e9ee; --muted: #98a0ae;
      --border: #2a2f3a; --accent: #5b8cff; --accent-text: #0b0d12; --danger: #ff6b6b; --ok: #4cc38a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 16px rgba(0,0,0,.25);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; }
  button, input, select { font: inherit; color: inherit; }

  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
  .bar { max-width: 1400px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 17px; margin-right: auto; display: flex; align-items: center; gap: 8px; }
  .brand svg { flex: none; }
  .search { flex: 1 1 220px; max-width: 360px; }
  input[type=search], input[type=url], select {
    width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); }
  select { width: auto; max-width: 220px; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .6; cursor: progress; }
  .status { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 16px 8px; color: var(--muted); font-size: 13px; }

  main { max-width: 1400px; margin: 0 auto; padding: 20px 16px 48px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
  .card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); transition: transform .12s, border-color .12s; }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card-link { display: flex; flex-direction: column; flex: 1; text-decoration: none; }
  .actions { display: flex; align-items: center; gap: 2px; padding: 0 10px 10px 16px; }
  .reason { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn[data-rate="1"][aria-pressed="true"] { color: var(--ok); }
  .icon-btn[data-rate="1"][aria-pressed="true"] svg { fill: color-mix(in srgb, var(--ok) 20%, transparent); }
  .icon-btn[data-rate="-1"][aria-pressed="true"] { color: var(--danger); }
  .icon-btn[data-rate="-1"][aria-pressed="true"] svg { fill: color-mix(in srgb, var(--danger) 20%, transparent); }
  .views { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
  .views button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 14px; }
  .views button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .notice { margin: 0 0 16px; padding: 10px 14px; border-radius: 10px; background: var(--surface-2); color: var(--muted); font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 12px; align-items: center;
    padding: 10px 12px 10px 16px; border-radius: 10px; background: var(--text); color: var(--bg); box-shadow: var(--shadow); font-size: 14px; z-index: 10; }
  .toast[hidden] { display: none; }
  .toast button { border: 0; background: none; color: inherit; font-weight: 700; cursor: pointer; padding: 4px 6px; text-decoration: underline; }
  .thumb { aspect-ratio: 16 / 10; background: var(--surface-2); overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.empty { display: grid; place-items: center; color: var(--muted); font-weight: 700; font-size: 28px; letter-spacing: .02em; }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
  .meta .src { color: var(--accent); font-weight: 600; }
  .card h2 { font-size: 17px; line-height: 1.3; margin: 0; }
  .card p { margin: 0; color: var(--muted); font-size: 14px;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .empty-state { text-align: center; color: var(--muted); padding: 80px 16px; }
  .more { display: flex; justify-content: center; margin-top: 24px; }

  dialog { width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 64px); border: 1px solid var(--border);
    border-radius: 14px; padding: 0; background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .dlg-head h2 { margin: 0; font-size: 18px; }
  .dlg-body { padding: 16px 20px 20px; overflow: auto; }
  .add { display: flex; gap: 8px; margin-bottom: 6px; }
  .hint { font-size: 13px; color: var(--muted); margin: 0 0 14px; min-height: 1.5em; }
  .hint.err { color: var(--danger); }
  .src-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .src-item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; }
  .src-item.off { opacity: .55; }
  .src-title { font-weight: 600; overflow-wrap: anywhere; }
  .src-url { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; grid-column: 1; }
  .src-actions { grid-row: 1 / span 3; grid-column: 2; display: flex; gap: 6px; align-items: start; }
  .src-actions .btn { padding: 4px 10px; font-size: 13px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
  .src-err { font-size: 12px; color: var(--danger); grid-column: 1; overflow-wrap: anywhere; }
  .btn.danger:hover { color: var(--danger); border-color: var(--danger); }
  @media (max-width: 560px) {
    .search { max-width: none; order: 5; flex-basis: 100%; }
    select { max-width: 150px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M8 9h16M8 15h16M8 21h10" stroke="white" stroke-width="3" stroke-linecap="round"/></svg>
      Newsfeed Lite
    </div>
    <div class="views" role="group" aria-label="View">
      <button id="viewLatest" data-view="latest" aria-pressed="true">Latest</button>
      <button id="viewForYou" data-view="foryou" aria-pressed="false">For you</button>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Search headlines and previews" aria-label="Search"></div>
    <select id="source" aria-label="Filter by source"><option value="">All sources</option></select>
    <button class="btn" id="sourcesBtn">Sources</button>
    <button class="btn primary" id="refresh">Refresh</button>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
</header>

<main>
  <p class="notice" id="notice" hidden></p>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="empty" hidden></div>
  <div class="more"><button class="btn" id="more" hidden>Load more</button></div>
</main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-head">
    <h2 id="dlgTitle">Sources</h2>
    <button class="btn" id="close" aria-label="Close">Close</button>
  </div>
  <div class="dlg-body">
    <form class="add" id="addForm">
      <input id="addUrl" type="url" required placeholder="https://thenewstack.io/ or a topic page or RSS URL" aria-label="Source URL">
      <button class="btn primary" id="addBtn">Add</button>
    </form>
    <p class="hint" id="addHint">A site's home page, a topic or category page, or a feed URL. The feed is found automatically.</p>
    <ul class="src-list" id="srcList"></ul>
  </div>
</dialog>

<div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button id="toastUndo">Undo</button></div>

<script>
const $ = (id) => document.getElementById(id);
const PAGE = 60;
let offset = 0, total = 0, sources = [], wasRunning = false;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} hr ago`;
  if (s < 86400 * 14) return `${Math.floor(s / 86400)}d ago`;
  return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

function host(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } }

function card(a) {
  const img = a.image_path ? `/images/${encodeURIComponent(a.image_path)}` : a.image_url;
  const initial = esc((a.source_title || host(a.url)).trim()[0] || "?").toUpperCase();
  const thumb = img
    ? `<div class="thumb"><img loading="lazy" src="${esc(img)}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.className='thumb empty';this.parentNode.textContent='${initial}'"></div>`
    : `<div class="thumb empty">${initial}</div>`;
  const when = a.published_at ? ago(a.published_at) : `added ${ago(a.fetched_at)}`;
  return `<article class="card" data-id="${a.id}">
    <a class="card-link" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">
      ${thumb}
      <div class="body">
        <div class="meta"><span class="src">${esc(a.source_title || host(a.url))}</span>${when ? `<span>·</span><span>${when}</span>` : ""}${a.author ? `<span>·</span><span>${esc(a.author)}</span>` : ""}</div>
        <h2>${esc(a.title)}</h2>
        ${a.excerpt ? `<p>${esc(a.excerpt)}</p>` : ""}
      </div>
    </a>
    <div class="actions">
      <span class="reason" title="${esc(a.reason)}">${esc(a.reason)}</span>
      <button class="icon-btn" data-rate="1" aria-pressed="${a.rating === 1}" aria-label="More like this" title="More like this">${ICON.up}</button>
      <button class="icon-btn" data-rate="-1" aria-pressed="${a.rating === -1}" aria-label="Less like this" title="Less like this">${ICON.down}</button>
      <button class="icon-btn" data-hide aria-label="Hide" title="Hide">${ICON.hide}</button>
    </div>
  </article>`;
}

const ICON = {
  up: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>`,
  down: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg>`,
  hide: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.73 5.08A10.74 10.74 0 0 1 21.94 11.65a1 1 0 0 1 0 .7 10.75 10.75 0 0 1-1.44 2.49"/><path d="M14.08 14.16a3 3 0 0 1-4.24-4.24"/><path d="M17.48 17.5a10.75 10.75 0 0 1-15.42-5.15 1 1 0 0 1 0-.7 10.75 10.75 0 0 1 4.45-5.14"/><path d="m2 2 20 20"/></svg>`,
};

let view = "latest";
try { if (localStorage.getItem("view") === "foryou") view = "foryou"; } catch {}

function setView(v) {
  view = v;
  try { localStorage.setItem("view", v); } catch {}
  for (const b of document.querySelectorAll(".views button")) b.setAttribute("aria-pressed", String(b.dataset.view === v));
  loadArticles();
}

const feedback = (id, body) =>
  fetch(`/api/articles/${id}/feedback`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

async function loadArticles(append = false) {
  if (!append) offset = 0;
  const params = new URLSearchParams({ limit: PAGE, offset, view });
  if ($("q").value.trim()) params.set("q", $("q").value.trim());
  if ($("source").value) params.set("source", $("source").value);
  const { total: t, rows, coldStart, reactions } = await (await fetch(`/api/articles?${params}`)).json();
  total = t;
  $("notice").hidden = !coldStart;
  if (coldStart) {
    const need = 3 - reactions;
    $("notice").textContent = `Rate ${need} more article${need === 1 ? "" : "s"} with 👍 or 👎 and For you will start ranking. Showing the latest for now.`;
  }
  const html = rows.map(card).join("");
  if (append) $("grid").insertAdjacentHTML("beforeend", html); else $("grid").innerHTML = html;
  offset += rows.length;
  $("more").hidden = offset >= total;
  const empty = !append && rows.length === 0;
  $("empty").hidden = !empty;
  if (empty) {
    $("empty").textContent = sources.length === 0
      ? "No sources yet. Open Sources and add a site, topic page or feed URL."
      : ($("q").value || $("source").value) ? "Nothing matches." : "No articles yet. Click Refresh to crawl your sources.";
  }
}

async function loadSources() {
  sources = await (await fetch("/api/sources")).json();
  const current = $("source").value;
  $("source").innerHTML = `<option value="">All sources</option>` +
    sources.map((s) => `<option value="${s.id}">${esc(s.title || host(s.url))}</option>`).join("");
  $("source").value = sources.some((s) => String(s.id) === current) ? current : "";
  $("srcList").innerHTML = sources.length ? sources.map((s) => `
    <li class="src-item${s.enabled ? "" : " off"}">
      <div class="src-title">${esc(s.title || host(s.url))}${s.mode ? `<span class="tag">${s.mode === "feed" ? "RSS" : "HTML"}</span>` : ""}<span class="tag">${s.article_count} articles</span></div>
      <div class="src-url">${esc(s.url)}${s.feed_url && s.feed_url !== s.url ? ` → ${esc(s.feed_url)}` : ""}</div>
      ${s.last_error ? `<div class="src-err">${esc(s.last_error)}</div>` : ""}
      <div class="src-actions">
        <button class="btn" data-toggle="${s.id}" data-enabled="${s.enabled}">${s.enabled ? "Pause" : "Resume"}</button>
        <button class="btn danger" data-del="${s.id}" aria-label="Remove ${esc(s.title || s.url)}">Remove</button>
      </div>
    </li>`).join("") : `<li class="hint">No sources yet.</li>`;
}

async function pollStatus() {
  const s = await (await fetch("/api/status")).json();
  $("refresh").disabled = s.running;
  $("refresh").textContent = s.running ? "Crawling…" : "Refresh";
  $("status").textContent = s.running
    ? `Crawling ${s.sourcesDone}/${s.sourcesTotal} sources…`
    : s.lastRunAt ? `Last crawl ${ago(s.lastRunAt)}, ${s.lastRunNew} new · ${total} articles · auto-refresh every ${s.intervalMinutes} min` : "";
  if (wasRunning && !s.running) { await loadSources(); await loadArticles(); pollStatus(); }
  else if (s.running) { if (offset === 0 || $("grid").children.length < PAGE) loadArticles(); }
  wasRunning = s.running;
  setTimeout(pollStatus, s.running ? 2000 : 30000);
}

let qTimer;
$("q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(() => loadArticles(), 250); });
$("source").addEventListener("change", () => loadArticles());
$("more").addEventListener("click", () => loadArticles(true));
for (const b of document.querySelectorAll(".views button")) b.addEventListener("click", () => setView(b.dataset.view));
for (const b of document.querySelectorAll(".views button")) b.setAttribute("aria-pressed", String(b.dataset.view === view));

// Opening an article is a mild "interested" signal. A beacon survives the tab switching away.
function logClick(e) {
  const link = e.target.closest(".card-link");
  if (!link || (e.type === "auxclick" && e.button !== 1)) return;
  const id = link.closest(".card").dataset.id;
  navigator.sendBeacon(`/api/articles/${id}/feedback`, new Blob([JSON.stringify({ click: true })], { type: "application/json" }));
}
$("grid").addEventListener("click", logClick);
$("grid").addEventListener("auxclick", logClick);

let toastTimer, undoHide;
function toast(text, undo) {
  $("toastText").textContent = text;
  undoHide = undo;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => ($("toast").hidden = true), 6000);
}
$("toastUndo").addEventListener("click", () => { $("toast").hidden = true; undoHide?.(); });

$("grid").addEventListener("click", async (e) => {
  const btn = e.target.closest(".actions button");
  if (!btn) return;
  const cardEl = btn.closest(".card");
  const id = cardEl.dataset.id;
  if (btn.dataset.rate) {
    const on = btn.getAttribute("aria-pressed") !== "true";
    const rating = on ? Number(btn.dataset.rate) : 0;
    for (const b of cardEl.querySelectorAll("[data-rate]")) b.setAttribute("aria-pressed", String(on && b === btn));
    await feedback(id, { rating });
  } else if ("hide" in btn.dataset) {
    const next = cardEl.nextSibling, parent = cardEl.parentNode;
    cardEl.remove();
    await feedback(id, { hidden: true });
    toast("Hidden. You'll see less like this.", async () => {
      parent.insertBefore(cardEl, next);
      await feedback(id, { hidden: false });
    });
  }
});
$("refresh").addEventListener("click", async () => {
  await fetch("/api/crawl", { method: "POST" });
  wasRunning = true;
  $("refresh").disabled = true;
  setTimeout(pollStatus, 500);
});
$("sourcesBtn").addEventListener("click", () => $("dlg").showModal());
$("close").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("close", () => loadArticles());

$("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const hint = $("addHint");
  $("addBtn").disabled = true;
  hint.className = "hint";
  hint.textContent = "Looking for a feed… (this can take a few seconds)";
  try {
    const r = await fetch("/api/sources", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: $("addUrl").value }) });
    const s = await r.json();
    if (!r.ok) throw new Error(s.error || "Could not add source");
    if (s.last_error) { hint.className = "hint err"; hint.textContent = `Added, but: ${s.last_error}`; }
    else hint.textContent = s.mode === "feed" ? `Added. Found a feed: ${s.feed_url}. Click Refresh to crawl.` : "Added. No feed found, so articles will be scraped from the page. Click Refresh to crawl.";
    $("addUrl").value = "";
    await loadSources();
  } catch (err) {
    hint.className = "hint err";
    hint.textContent = err.message;
  } finally {
    $("addBtn").disabled = false;
  }
});

$("srcList").addEventListener("click", async (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.del) {
    if (!confirm("Remove this source and its stored articles?")) return;
    await fetch(`/api/sources/${t.dataset.del}`, { method: "DELETE" });
  } else if (t.dataset.toggle) {
    await fetch(`/api/sources/${t.dataset.toggle}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: t.dataset.enabled !== "1" }) });
  }
  await loadSources();
});

(async () => { await loadSources(); await loadArticles(); pollStatus(); })();
</script>
</body>
</html>
